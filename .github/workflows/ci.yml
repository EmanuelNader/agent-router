name: Compatibility checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm plan:oci --demo
      - run: pnpm deploy:oci --dry-run --demo
      - run: pnpm destroy:oci --dry-run
      - run: pnpm agent:probe
      - run: pnpm agent:roundtrip
